<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="942" viewBox="0 0 1000 942"><title id="title">FoldLedger booklet imposition</title><desc id="desc">Each row is one sheet, outermost first. Each face is viewed from its printed side. Dashed lines indicate folds. Blank slots are intentionally empty.</desc><rect width="100%" height="100%" fill="#f3f5f7"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="36" y="44" font-size="28" font-weight="bold">FoldLedger / booklet plan</text><text x="36" y="77" font-size="16">18 selected pages / 5 sheets / 2 signatures / 2 blanks</text><text x="36" y="106" font-size="13">Left binding / short-edge duplex / preview 5 of 5 sheets</text><text x="36" y="149" font-size="13">Signature 1 / sheet 1 (outer to inner)</text><g><rect x="36" y="162" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="48" y="182" font-size="11" fill="#61728b">FRONT / rotate 0</text><path d="M 256 162 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 256 214)" text-anchor="middle" font-size="27" font-weight="bold"><text x="146" y="229">16</text><text x="366" y="229">1</text></g></g><g><rect x="516" y="162" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="528" y="182" font-size="11" fill="#61728b">BACK / rotate 0</text><path d="M 736 162 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 736 214)" text-anchor="middle" font-size="27" font-weight="bold"><text x="626" y="229">2</text><text x="846" y="229">15</text></g></g><text x="36" y="303" font-size="13">Signature 1 / sheet 2 (outer to inner)</text><g><rect x="36" y="316" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="48" y="336" font-size="11" fill="#61728b">FRONT / rotate 0</text><path d="M 256 316 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 256 368)" text-anchor="middle" font-size="27" font-weight="bold"><text x="146" y="383">14</text><text x="366" y="383">3</text></g></g><g><rect x="516" y="316" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="528" y="336" font-size="11" fill="#61728b">BACK / rotate 0</text><path d="M 736 316 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 736 368)" text-anchor="middle" font-size="27" font-weight="bold"><text x="626" y="383">4</text><text x="846" y="383">13</text></g></g><text x="36" y="457" font-size="13">Signature 1 / sheet 3 (outer to inner)</text><g><rect x="36" y="470" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="48" y="490" font-size="11" fill="#61728b">FRONT / rotate 0</text><path d="M 256 470 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 256 522)" text-anchor="middle" font-size="27" font-weight="bold"><text x="146" y="537">12</text><text x="366" y="537">5</text></g></g><g><rect x="516" y="470" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="528" y="490" font-size="11" fill="#61728b">BACK / rotate 0</text><path d="M 736 470 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 736 522)" text-anchor="middle" font-size="27" font-weight="bold"><text x="626" y="537">6</text><text x="846" y="537">11</text></g></g><text x="36" y="611" font-size="13">Signature 1 / sheet 4 (outer to inner)</text><g><rect x="36" y="624" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="48" y="644" font-size="11" fill="#61728b">FRONT / rotate 0</text><path d="M 256 624 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 256 676)" text-anchor="middle" font-size="27" font-weight="bold"><text x="146" y="691">10</text><text x="366" y="691">7</text></g></g><g><rect x="516" y="624" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="528" y="644" font-size="11" fill="#61728b">BACK / rotate 0</text><path d="M 736 624 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 736 676)" text-anchor="middle" font-size="27" font-weight="bold"><text x="626" y="691">8</text><text x="846" y="691">9</text></g></g><text x="36" y="765" font-size="13">Signature 2 / sheet 1 (outer to inner)</text><g><rect x="36" y="778" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="48" y="798" font-size="11" fill="#61728b">FRONT / rotate 0</text><path d="M 256 778 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 256 830)" text-anchor="middle" font-size="27" font-weight="bold"><text x="146" y="845">BLANK</text><text x="366" y="845">17</text></g></g><g><rect x="516" y="778" width="440" height="104" rx="8" fill="white" stroke="#c0cad6"/><text x="528" y="798" font-size="11" fill="#61728b">BACK / rotate 0</text><path d="M 736 778 v 104" stroke="#9aaec2" stroke-dasharray="5 5"/><g transform="rotate(0 736 830)" text-anchor="middle" font-size="27" font-weight="bold"><text x="626" y="845">18</text><text x="846" y="845">BLANK</text></g></g></g></svg>
